<!doctype html>
<html lang="fr">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
    <meta name="theme-color" content="#0f1115" />
    <link rel="manifest" href="./manifest.webmanifest" />
    <link rel="icon" href="./icon.svg" type="image/svg+xml" />
    <title>Muscu</title>
  </head>
  <body>
    <div id="root"></div>
    <script>
      // Filet de sécurité : si l'appli ne s'affiche pas (fichier introuvable…), on recharge une fois sans cache.
      setTimeout(function () {
        if (document.getElementById('root').children.length) return
        try {
          if (sessionStorage.getItem('secours')) return
          sessionStorage.setItem('secours', '1')
        } catch (e) {}
        location.replace(location.pathname + '?v=' + Date.now())
      }, 6000)
    </script>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
