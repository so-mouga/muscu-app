name: Déploiement

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
      - run: npm ci
      - run: npm test
      - run: npm run build
      # Parcours principal dans un vrai navigateur (séance, export / import, ancienne base) : bloque la mise en ligne s'il casse.
      # Sans --with-deps : la machine de GitHub a déjà ce qu'il faut pour Chrome, et ces paquets Ubuntu (des polices)
      # ont bloqué la mise en ligne le 11 nov. 2026, quand leurs serveurs étaient injoignables.
      - run: npx playwright install chromium
      - run: npm run e2e
      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v3
        with:
          path: dist

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
